[package]
name = "humoco-wot"
version = "0.2.2"
edition = "2024"
description = "Subjective, offline-first Web of Trust library (128-bit SD-JWTs, Shared-Edge Factoring, Delta-Sync) for HuMoCo"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1.11"
